<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearthwood — a cozy medieval wood</title>
<meta name="description" content="Choose a frog, a fox or a bear, and walk out of a small medieval village into an enormous wood. Every fallen stick is different. Bring the interesting ones back to the Stickwright and she will make them into something.">
<meta name="theme-color" content="#1b2418">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css?v=20260921145028">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231b2418'/><path d='M6 25 L20 9 a2 2 0 0 1 3 3 L9 28 Z' fill='%23a8814f'/><path d='M19 12 L25 6 l2 2 -6 6 Z' fill='%23a8814f'/><circle cx='11' cy='20' r='2.6' fill='%235f8a37'/></svg>">
</head>
<body>

<canvas id="view"></canvas>

<!-- the warm vignette and the faint bloom of the whole picture. Doing this
     in CSS rather than as a render pass keeps the WebGL side free of any
     hand-written colour transform, which is where gamma bugs come from. -->
<div id="grade" aria-hidden="true"></div>

<div id="hud"></div>
<div id="prompt" class="hidden"></div>
<div id="ui"></div>
<div id="toasts"></div>

<div id="boot">
  <div class="boot-inner">
    <svg class="boot-mark" viewBox="0 0 120 120" width="132" height="132" aria-hidden="true">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#cfa967"/><stop offset="1" stop-color="#7a5c33"/>
        </linearGradient>
      </defs>
      <circle cx="60" cy="60" r="52" fill="none" stroke="#3d4a33" stroke-width="2"/>
      <path d="M26 96 L78 30 a7 7 0 0 1 10 10 L36 106 Z" fill="url(%23bg)"/>
      <path d="M74 36 L96 16 l8 8 -22 20 Z" fill="url(%23bg)"/>
      <path d="M58 56 L80 78 l-8 8 -22-22 Z" fill="url(%23bg)"/>
      <circle cx="42" cy="78" r="9" fill="#5f8a37"/>
      <circle cx="52" cy="66" r="6" fill="#4a7229"/>
    </svg>
    <h1 class="boot-title">Hearthwood</h1>
    <p class="boot-tag">Every stick in the wood is a different stick.</p>
    <div class="boot-track"><div id="boot-bar"></div></div>
    <div id="boot-text">WAKING THE WOOD</div>
  </div>
</div>

<script type="module" src="src/main.js?v=20260921145028"></script>
<noscript>
  <div style="position:fixed;inset:0;display:grid;place-items:center;background:#1b2418;color:#e6dcc4;font-family:Georgia,serif;padding:2rem;text-align:center">
    Hearthwood needs JavaScript and WebGL.
  </div>
</noscript>
</body>
</html>
